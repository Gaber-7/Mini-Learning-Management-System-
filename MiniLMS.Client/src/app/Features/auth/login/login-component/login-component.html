<div class="container-fluid vh-100 bg-light">
  <div class="row h-100 justify-content-center align-items-center">
    <div class="col-11 col-sm-8 col-md-6 col-lg-4">

      <div class="card shadow border-0 rounded-4">
        <div class="card-body p-4">

          <div class="text-center mb-4">
            <h2 class="fw-bold">Login</h2>
            <p class="text-muted">
              Welcome back to the MiniLMS Learning Platform
            </p>
          </div>

          <form [formGroup]="loginForm" (ngSubmit)="onSubmit()">

            <!-- Username -->
            <div class="mb-3">
              <label for="username" class="form-label">
                Username
              </label>

              <input
                id="username"
                type="text"
                formControlName="username"
                class="form-control"
                placeholder="Enter your username">

              <div
                *ngIf="loginForm.get('username')?.touched && loginForm.get('username')?.errors?.['required']"
                class="text-danger small mt-1">
                Username is required
              </div>
            </div>

            <!-- Password -->
            <div class="mb-3">
              <label for="password" class="form-label">
                Password
              </label>

              <input
                id="password"
                type="password"
                formControlName="password"
                class="form-control"
                placeholder="••••••••">

              <div
                *ngIf="loginForm.get('password')?.touched && loginForm.get('password')?.errors?.['required']"
                class="text-danger small mt-1">
                Password is required
              </div>
            </div>

            <!-- Login Button -->
            <div class="d-grid mt-4">
              <button
                type="submit"
                class="btn btn-primary"
                [disabled]="isLoading">

                <span
                  *ngIf="isLoading"
                  class="spinner-border spinner-border-sm me-2">
                </span>

                {{ isLoading ? 'Verifying...' : 'Login' }}
              </button>
            </div>

            <div class="text-center mt-4">
              <span class="text-muted">
                Don't have a student account?
              </span>

              <a routerLink="/signup" class="text-decoration-none fw-semibold">
                Create one now
              </a>
            </div>

          </form>

        </div>
      </div>

    </div>
  </div>
</div>
