<div class="auth-wrapper d-flex align-items-center justify-content-center min-vh-100 p-3 p-md-4">

  <!-- Background decorative glow spheres -->
  <div class="glow-sphere glow-sphere-1"></div>
  <div class="glow-sphere glow-sphere-2"></div>
  <div class="glow-sphere glow-sphere-3"></div>

  <div class="container auth-container">
    <div class="row justify-content-center">
      <div class="col-12 col-md-10 col-lg-8 col-xl-5">

        <div class="glass-panel auth-card p-4 p-md-5 position-relative overflow-hidden">
          
          <!-- Brand Header -->
          <div class="text-center mb-4">
            <div class="brand-badge mb-3 d-inline-flex align-items-center gap-2 px-3 py-1 rounded-pill">
              <i class="bi bi-mortarboard-fill text-warning"></i>
              <span class="fw-bold tracking-wide">MiniLMS ACADEMY</span>
            </div>
            <h2 class="fw-bold text-white mb-2">Welcome Back</h2>
            <p class="text-muted small mb-0">Sign in to your learning dashboard and continue your journey</p>
          </div>

          <!-- Error Alert Banner -->
          <div *ngIf="errorMessage" class="alert alert-danger glass-card border-danger text-white rounded-3 p-3 small mb-4 d-flex align-items-center gap-2 animate-shake" role="alert">
            <i class="bi bi-exclamation-triangle-fill fs-5 text-danger"></i>
            <div>{{ errorMessage }}</div>
          </div>

          <form [formGroup]="loginForm" (ngSubmit)="onSubmit()">

            <!-- Username Field -->
            <div class="mb-3">
              <label for="username" class="form-label text-slate-300 small fw-semibold">
                <i class="bi bi-person me-1 text-info"></i> Username
              </label>
              <div class="input-group">
                <span class="input-group-text glass-input-icon border-end-0">
                  <i class="bi bi-person-fill text-muted"></i>
                </span>
                <input
                  id="username"
                  type="text"
                  formControlName="username"
                  class="form-control glass-input border-start-0 ps-0"
                  placeholder="e.g. johndoe"
                  autocomplete="username">
              </div>

              <div *ngIf="loginForm.get('username')?.touched && loginForm.get('username')?.errors?.['required']" class="text-danger small mt-1 ps-1">
                Username is required.
              </div>
            </div>

            <!-- Password Field -->
            <div class="mb-4">
              <div class="d-flex justify-content-between align-items-center mb-1">
                <label for="password" class="form-label text-slate-300 small fw-semibold mb-0">
                  <i class="bi bi-shield-lock me-1 text-warning"></i> Password
                </label>
              </div>

              <div class="input-group">
                <span class="input-group-text glass-input-icon border-end-0">
                  <i class="bi bi-key-fill text-muted"></i>
                </span>
                <input
                  id="password"
                  [type]="showPassword ? 'text' : 'password'"
                  formControlName="password"
                  class="form-control glass-input border-start-0 border-end-0 ps-0"
                  placeholder="••••••••"
                  autocomplete="current-password">
                <button
                  type="button"
                  class="input-group-text glass-input-icon border-start-0 cursor-pointer"
                  (click)="showPassword = !showPassword"
                  title="Toggle Password Visibility">
                  <i class="bi" [ngClass]="showPassword ? 'bi-eye-slash-fill text-info' : 'bi-eye-fill text-muted'"></i>
                </button>
              </div>

              <div *ngIf="loginForm.get('password')?.touched && loginForm.get('password')?.errors?.['required']" class="text-danger small mt-1 ps-1">
                Password is required.
              </div>
            </div>

            <!-- Submit Button -->
            <button
              type="submit"
              class="btn btn-luxury-primary w-100 py-3 fw-bold d-flex align-items-center justify-content-center gap-2 mb-3"
              [disabled]="isLoading">
              <span *ngIf="isLoading" class="spinner-border spinner-border-sm"></span>
              <i *ngIf="!isLoading" class="bi bi-box-arrow-in-right fs-5"></i>
              <span>{{ isLoading ? 'Verifying Account...' : 'Sign In to Account' }}</span>
            </button>

            <!-- Switch to Signup -->
            <div class="text-center pt-3 border-top border-white border-opacity-10">
              <span class="text-muted small">Don't have an account yet?</span>
              <a routerLink="/signup" class="text-warning text-decoration-none fw-bold small ms-2 hover-underline">
                Create Account <i class="bi bi-arrow-right-short"></i>
              </a>
            </div>

          </form>

        </div>

      </div>
    </div>
  </div>

</div>
