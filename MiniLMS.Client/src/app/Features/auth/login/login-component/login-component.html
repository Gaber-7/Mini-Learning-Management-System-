<div class="container-fluid vh-100 login-bg">  
  <div class="row h-100 justify-content-center align-items-center">  
    <div class="col-11 col-sm-8 col-md-6 col-lg-4">  

      <div class="card shadow-lg border-0 rounded-4 glass-card">  
        <div class="card-body p-4 p-md-5">  

          <div class="text-center mb-4">  
            <h2 class="fw-bold brand-title">Gen Alpha</h2>  
            <p class="text-muted small">  
              Sign in to your learning dashboard and continue your journey  
            </p>  
          </div>  

          <!-- Error Alert -->  
          <div *ngIf="errorMessage" class="alert alert-danger rounded-3 p-3 small mb-3 d-flex align-items-center gap-2" role="alert">  
            <i class="bi bi-exclamation-triangle-fill fs-5"></i>  
            <div>{{ errorMessage }}</div>  
          </div>  

          <form [formGroup]="loginForm" (ngSubmit)="onSubmit()">  

            <!-- Username -->  
            <div class="mb-3">  
              <label for="username" class="form-label fw-semibold small text-secondary">  
                Username  
              </label>  

              <input  
                id="username"  
                type="text"  
                formControlName="username"  
                class="form-control rounded-3 custom-input"  
                placeholder="Enter your username">  

              <div  
                *ngIf="loginForm.get('username')?.touched && loginForm.get('username')?.errors?.['required']"  
                class="text-danger small mt-1">  
                Username is required  
              </div>  
            </div>  

            <!-- Password -->  
            <div class="mb-3">  
              <label for="password" class="form-label fw-semibold small text-secondary">  
                Password  
              </label>  

              <input  
                id="password"  
                type="password"  
                formControlName="password"  
                class="form-control rounded-3 custom-input"  
                placeholder="••••••••">  

              <div  
                *ngIf="loginForm.get('password')?.touched && loginForm.get('password')?.errors?.['required']"  
                class="text-danger small mt-1">  
                Password is required  
              </div>  
            </div>  

            <!-- Login Button -->  
            <div class="d-grid mt-4">  
              <button  
                type="submit"  
                class="btn custom-btn rounded-3 py-2 fw-semibold shadow-sm"  
                [disabled]="isLoading">  

                <span  
                  *ngIf="isLoading"  
                  class="spinner-border spinner-border-sm me-2">  
                </span>  

                {{ isLoading ? 'Verifying Credentials...' : 'Sign In' }}  
              </button>  
            </div>  

            <div class="text-center mt-4">  
              <span class="text-muted small">  
                Don't have an account?  
              </span>  

              <a routerLink="/signup" class="text-decoration-none fw-semibold small ms-1 custom-link">  
                Create one now  
              </a>  
            </div>  

          </form>  

        </div>  
      </div>  

    </div>  
  </div>  
</div>  

<!-- Custom Styles for Burgundy & Navy Palette -->
<style>
  /* خلفية بتدرج هادئ يدمج الكحلي الغامق مع لمسة خفيفة من البرغندي */
  .login-bg {
    background: linear-gradient(135deg, #0f172a 0%, #1e1b4b 50%, #311026 100%);
  }

  /* تصميم الكارد ليصبح أنيقاً */
  .glass-card {
    background-color: rgba(255, 255, 255, 0.95);
    backdrop-filter: blur(10px);
  }

  /* عنوان احترافي يدمج اللونين في النص أو يعطي طابع الكحلي الداكن */
  .brand-title {
    color: #0f172a;
    background: linear-gradient(45deg, #1e1b4b, #6b21a8);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
  }

  /* تخصيص الحقول عند التركيز Focus لتأخذ لون المزيج */
  .custom-input:focus {
    border-color: #4c1d95;
    box-shadow: 0 0 0 0.25rem rgba(107, 33, 168, 0.15);
  }

  /* زر الدخول بلون البرغندي الغامق الفاخر (Burgundy) المتناسق مع الكحلي */
  .custom-btn {
    background-color: #6b21a8; /* أو يمكنك جعله برغندي صريح مثل #831843 */
    background: linear-gradient(135deg, #831843 0%, #4c1d95 100%);
    border: none;
    color: #ffffff;
    transition: all 0.3s ease;
  }

  .custom-btn:hover {
    background: linear-gradient(135deg, #9f1239 0%, #581c87 100%);
    color: #ffffff;
    transform: translateY(-1px);
  }

  /* روابط الصفحة */
  .custom-link {
    color: #831843;
  }
  
  .custom-link:hover {
    color: #4c1d95;
    text-decoration: underline !important;
  }
</style>
